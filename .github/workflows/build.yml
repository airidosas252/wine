name: Build Wine (ARM64)

on:
  push:
    branches: [ experimental_10.0 ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-mingw (bylaws fork)
        run: |
          RELEASE=$(curl -s https://api.github.com/repos/bylaws/llvm-mingw/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          URL="https://github.com/bylaws/llvm-mingw/releases/download/${RELEASE}/llvm-mingw-${RELEASE}-ucrt-ubuntu-22.04-aarch64.tar.xz"
          curl -L "$URL" | sudo tar -xJ -C /opt
          DIRNAME=$(ls /opt | grep llvm-mingw)
          echo "/opt/${DIRNAME}/bin" >> $GITHUB_PATH

      - name: Build FFmpeg 4.4
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          curl -L https://ffmpeg.org/releases/ffmpeg-4.4.4.tar.xz | tar -xJ
          cd ffmpeg-4.4.4
          ./configure --prefix=/opt/ffmpeg4 \
            --disable-programs --disable-doc \
            --disable-everything \
            --enable-shared --disable-static \
            --enable-avcodec --enable-avformat --enable-avutil \
            --enable-bsf=pcm_rechunk \
            --enable-demuxer=mov
          make -j$(nproc)
          sudo make install
          echo "PKG_CONFIG_PATH=/opt/ffmpeg4/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/ffmpeg4/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            libfontconfig-dev \
            libfreetype-dev \
            libgnutls28-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libkrb5-dev \
            libgl-dev \
            libpulse-dev \
            libsdl2-dev \
            libvulkan-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            libxshmfence-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbregistry-dev \
            flex bison \
            ccache \
            autoconf

      - name: Create Termux prefix path
        run: sudo mkdir -p /data/data/com.termux/files/usr/glibc && sudo chown $USER /data/data/com.termux/files/usr/glibc

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-arm64-${{ github.sha }}
          restore-keys: |
            ccache-arm64-

      - name: Autogen
        run: ./autogen.sh

      - name: Configure
        run: |
          export CCACHE_CPP2=yes
          ./configure \
            --prefix=/data/data/com.termux/files/usr/glibc \
            --enable-nls \
            --disable-tests \
            --without-alsa \
            --without-capi \
            --without-coreaudio \
            --without-cups \
            --without-dbus \
            --with-fontconfig \
            --with-freetype \
            --without-gettext \
            --with-gettextpo=no \
            --without-gphoto \
            --with-gnutls \
            --with-gstreamer \
            --without-inotify \
            --with-krb5 \
            --with-mingw=clang \
            --without-netapi \
            --without-opencl \
            --with-opengl \
            --without-osmesa \
            --without-oss \
            --without-pcap \
            --with-pthread \
            --with-pulse \
            --without-sane \
            --with-sdl \
            --without-udev \
            --without-unwind \
            --without-usb \
            --without-v4l2 \
            --with-vulkan \
            --with-xcomposite \
            --with-xcursor \
            --with-xfixes \
            --with-xinerama \
            --with-xinput \
            --with-xinput2 \
            --with-xrandr \
            --with-xrender \
            --without-xshape \
            --with-xshm \
            --without-xxf86vm \
            --with-wayland \
            --without-tests \
            --enable-archs=arm64ec,aarch64,i386 \
            --without-x

      - name: Build
        run: |
          export CCACHE_CPP2=yes
          CPPFLAGS="${CPPFLAGS/-fstack-protector-strong/}"
          CFLAGS="${CFLAGS/-fstack-protector-strong/}"
          CXXFLAGS="${CXXFLAGS/-fstack-protector-strong/}"
          LDFLAGS="${LDFLAGS/-Wl,-z,relro,-z,now/}"
          export CPPFLAGS CFLAGS CXXFLAGS LDFLAGS
          make -j$(nproc) CC="ccache cc" CXX="ccache c++"
          make install

      - name: Compress
        run: |
          BUILD_DATE=$(date +%Y-%m-%d)
          tar -cJf proton-10.0-arm64ec-${BUILD_DATE}.tar.xz -C /data/data/com.termux/files/usr/glibc .
          echo "ARTIFACT_NAME=proton-10.0-arm64ec-${BUILD_DATE}" >> $GITHUB_ENV

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: proton-10.0-arm64ec-*.tar.xz
          retention-days: 7
          compression-level: 0
